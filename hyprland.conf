exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Old window rules
#windowrulev2 = float, class:^(jetbrains-.*),title:^(win.*)
#windowrulev2 = noinitialfocus, opacity 0.9 0.9, class:^(jetbrains-.*)
#windowrulev2 = suppressevent maximize, class:.*
#windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


#windowrule = float, match:class:^jetbrains-.*, match:title:^win.*
#windowrule = noinitialfocus on, opacity 0.9 0.9, match:class:^jetbrains-.*
#windowrule = suppressevent maximize, match:class:.*
#windowrule = nofocus on, match:class:^$, match:title:^$, match:xwayland:on, match:floating:on, match:fullscreen:off, match:pinned:off


windowrule {
  name = jetbrains
  match:class = ^jetbrains-.*
  match:title = ^win.*
  float = on
  no_initial_focus = on
  opacity = 0.9 0.9
}

windowrule {
  name = jetbrains2
  match:class = .*
  suppress_event = maximize
}
windowrule { 
  name = other_jetbrains_stuff
  match:class = ^$
  match:title = ^$
  match:xwayland = on
  match:float = on
  match:fullscreen = off
  match:pin = off
  no_focus = on
}

