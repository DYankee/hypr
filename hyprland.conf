exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

windowrule {
  name = jetbrains
  match:class = ^(jetbrains-.*)
  match:title = ^win.*
  no_initial_focus = on
  float = on
  opacity = 0.9 0.9, 
}

windowrule {
  name = jetbrains2
  match:class = .*
  suppress_event = maximise
}

windowrule {
  name = other_jetbrains_stuff
  match:class = ^$
  match:title = ^$
  match:xwayland = on
  match:float = on
  match:fullscreen = off
  match:pin = off
  no_focus = on
}
windowrule {
  name = freeCad
  no_initial_focus = on
  match:class = FreeCAD
}

windowrule { 
  name = Dolphin
  no_initial_focus = on 
  match:class = Dolphin 
}

windowrule {
  name = goland
  no_initial_focus = on
  float = on
  match:class = ^(jetbrains-goland)
  match:title = ^win.* 
}

windowrule {
  name = goland2
  no_initial_focus = on
  match:class = ^(jetbrains-goland)
  match:title = ^$
  match:initial_title = ^$
  float = on   
}
windowrule { 
  name = idk
  suppress_event = maximize
  match:class = .* 
}

windowrule {
  name = idk2
  match:focus = no
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = on
  match:fullscreen = off
  match:pin = off
}

windowrule {
  name = godot_main
  match:class = ^(Godot)$
  match:title = ^(Godot)(.*)$
}

windowrule {
  name = godot_other
  match:class = ^(Godot)$
  match:title = ^(?!Godot)(.*)$
}

################
### MONITORS ###
################
source=./monitors.conf

###################
### MY PROGRAMS ###
###################
source=./programs.conf

###################
